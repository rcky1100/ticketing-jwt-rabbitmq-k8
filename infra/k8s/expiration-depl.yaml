apiVersion: apps/v1
kind: Deployment
metadata:
  name: expiration-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expiration
  template:
    metadata:
      labels:
        app: expiration
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbit-mq-srv 5672; do
                echo "Waiting for RabbitMQ..."
                sleep 2
              done
              echo "RabbitMQ is accepting connections!"
      containers:
        - name: expiration
          image: rmq-expiration-app:1.0
          env:
            - name: RABBIT_MQ_URL
              value: "amqp://admin:admin@rabbit-mq-srv:5672"
            - name: REDIS_HOST
              value: expiration-redis-srv
