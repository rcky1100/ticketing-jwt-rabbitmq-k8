apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbit-mq-srv 5672; do
                echo "Waiting for RabbitMQ..."
                sleep 2
              done
              echo "RabbitMQ is accepting connections!"
      containers:
        - name: orders
          image: rmq-orders-app:1.0
          env:
            - name: RABBIT_MQ_URL
              value: "amqp://admin:admin@rabbit-mq-srv:5672"
            - name: MONGO_URI
              value: "mongodb://orders-mongo-srv:27017/orders"
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: orders-srv
spec:
  selector:
    app: orders
  ports:
    - name: orders
      protocol: TCP
      port: 3000
      targetPort: 3003
